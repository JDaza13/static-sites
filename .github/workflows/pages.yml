# Deploy every top-level folder of the repo as its own static site on GitHub Pages:
#   https://<user>.github.io/<repo>/<folder>/
#
# Adding a site: create a new top-level folder that either
#   • has a package.json whose `build` script writes to dist/ (or build/, out/), and
#     uses the BASE_PATH env var as its base URL (Vite: `base: process.env.BASE_PATH ?? "/"`), or
#   • is plain HTML with an index.html at its root.
# then run `pnpm install` at the repo root (one shared pnpm-lock.yaml) and push
# to main. See scripts/build-all.sh.
#
# One-time prerequisite: Settings ▸ Pages ▸ Build and deployment ▸ Source ▸ "GitHub Actions".

name: Deploy sites to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # pnpm version comes from "packageManager" in the root package.json.
      # cache: true restores the pnpm store, keyed on pnpm-lock.yaml.
      - uses: pnpm/action-setup@v6
        with:
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Build all sites
        run: bash scripts/build-all.sh

      - uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5

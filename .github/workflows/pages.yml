# Deploy every top-level folder of the repo as its own static site on GitHub Pages:
#   https://<user>.github.io/<repo>/<folder>/
#
# Adding a site: create a new top-level folder that either
#   • has a package.json whose `npm run build` writes to dist/ (or build/, out/), and
#     uses the BASE_PATH env var as its base URL (Vite: `base: process.env.BASE_PATH ?? "/"`), or
#   • is plain HTML with an index.html at its root.
# Then push to main. See scripts/build-all.sh.
#
# One-time prerequisite: Settings ▸ Pages ▸ Build and deployment ▸ Source ▸ "GitHub Actions".

name: Deploy sites to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: "*/package-lock.json"

      - name: Build all sites
        run: bash scripts/build-all.sh

      - uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
